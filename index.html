<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#d9531e">
<link rel="apple-touch-icon" href="icon-192.png">
<title>FoodSuite AI</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#2b2118;--mu:#7a6a5c;--ac:#d9531e;--bd:#e8dfd3}
@media (prefers-color-scheme:dark){:root{--bg:#1b1612;--card:#262019;--tx:#f3ebe1;--mu:#a8998a;--ac:#f0743e;--bd:#3a3128}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:12px 16px;font-weight:700;font-size:18px;display:flex;gap:10px;align-items:center}header span{color:var(--ac)}#emp{font-weight:400;color:var(--mu);font-size:14px}#out{margin-left:auto}
nav{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px}
nav button{white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 12px;border-radius:20px;cursor:pointer}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{padding:0 16px 24px;max-width:1100px;margin:auto}h2{margin:6px 0 12px;font-size:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi b{display:block;font-size:24px}.kpi small,.mu{color:var(--mu)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 12px;cursor:pointer}.btn.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-size:13px}
input,select{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin:3px 0 8px}label{font-size:13px;color:var(--mu)}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);width:min(420px,92vw)}
.kan{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:10px;overflow-x:auto}.col{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px;min-height:160px}
.col h3{margin:2px 4px 8px;font-size:14px}.k{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;margin-bottom:8px;cursor:grab;font-size:14px}
.wa{display:grid;grid-template-columns:140px minmax(220px,1fr) 150px;gap:10px;overflow-x:auto}.chat{min-height:180px;max-height:320px;overflow-y:auto;margin-bottom:8px}.msg{max-width:80%;padding:6px 10px;border-radius:10px;margin-bottom:6px;background:var(--bg)}.msg.u,.msg.s{margin-left:auto;background:var(--ac);color:#fff}
.cal{display:grid;grid-template-columns:repeat(7,minmax(70px,1fr));gap:4px;overflow-x:auto}.d{background:var(--card);border:1px solid var(--bd);border-radius:8px;min-height:64px;padding:4px;font-size:12px;cursor:pointer}.d i{display:block;font-style:normal;background:var(--ac);color:#fff;border-radius:4px;padding:1px 4px;margin-top:2px}
.qrs{display:flex;flex-wrap:wrap;gap:16px;margin:10px 0}.qrc{text-align:center;max-width:180px}.qrc img{width:160px;height:160px;image-rendering:pixelated}.qrc small{display:block;word-break:break-all;font-size:10px}
@media print{header,nav,.btn,label,input,.card>p{display:none!important}.qrc{break-inside:avoid}}
.mark,.brand{color:#7a4b22}.mark{display:inline-flex}.brand{font-family:Pacifico,"Brush Script MT","Segoe Script",cursive;font-weight:400;font-size:24px;line-height:1}.brand b{color:var(--ac);font-weight:400}
@media (prefers-color-scheme:dark){.mark,.brand{color:#e8c9a0}}
a.btn{text-decoration:none;display:inline-block}
</style>
</head>
<body>
<header><span class="mark" id="logo"></span><span class="brand">FoodSuite <b>AI</b></span><span id="emp"></span><button class="btn g" id="out" style="display:none" onclick="logout()">Salir</button></header>
<nav id="nav"></nav>
<main id="app"></main>
<dialog id="dlg"><div id="dbody"></div></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
const SB=window.supabase.createClient('https://gxlcfutcmmjfstnawxyt.supabase.co','sb_publishable_uNMs5gLEP3B5CbCjZ2V5gA_tAsYbQa5');
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>'$'+Number(n||0).toLocaleString('es-AR');
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const ST=[['nuevo','Nuevo'],['produccion','Producción'],['entrega','Entrega'],['finalizado','Finalizado']];
const lab=e=>(ST.find(x=>x[0]===e)||[0,e])[1];
const VIEWS=[['dashboard','Dashboard'],['reportes','Reportes'],['ia','Asistente'],['clientes','CRM'],['pedidos','Pedidos'],['kanban','Producción'],['whatsapp','WhatsApp'],['calendario','Calendario'],['reservas','Reservas'],['productos','Productos'],['categorias','Categorías'],['qr','QR local'],['negocio','Mi negocio'],['admin','Administración']];
const CFG={
clientes:{t:'CRM Clientes',f:[['nombre','Nombre'],['telefono','Teléfono'],['email','Email'],['vip','VIP','select',['No','Sí']],['observaciones','Observaciones']]},
productos:{t:'Productos',f:[['nombre','Nombre'],['precio','Precio','number'],['descripcion','Descripción']]}};
let S={clientes:[],productos:[],pedidos:[],categorias:[],reservas:[]},view='dashboard',draft=[];
const err=e=>{if(e){alert('Error: '+e.message);return true}};
const cname=id=>(S.clientes.find(x=>x.id===id)||{}).nombre||'?';
const pname=id=>(S.productos.find(x=>x.id===id)||{}).nombre||'?';
const itxt=o=>(o.pedido_detalle||[]).map(i=>i.cantidad+'× '+pname(i.producto_id)).join(', ')+(o.tipo==='retiro'?' · Retira: '+(o.retira||'')+' · Pago: '+(o.forma_pago||''):'')+(Number(o.sena)>0?' · Seña '+money(o.sena)+(o.sena_pagada?' ✓':' (pendiente)'):'')+(o.notas?' — "'+o.notas+'"':'');
const cs=id=>{const P=S.pedidos.filter(o=>o.cliente_id===id);return{n:P.length,t:P.reduce((s,o)=>s+Number(o.total),0)}};

async function boot(){const{data}=await SB.auth.getSession();data.session?load():showLogin()}
function showLogin(){$('nav').innerHTML='';$('#out').style.display='none';$('#emp').textContent='';
$('#app').innerHTML=`<div class="card" style="max-width:340px;margin:40px auto"><div style="text-align:center;margin-bottom:8px"><span class="mark">${LOGO(90)}</span><div class="brand" style="font-size:30px">FoodSuite <b>AI</b></div></div><h2>Ingresar</h2><label>Email</label><input id="l_e" type="email"><label>Password</label><input id="l_p" type="password" onkeydown="if(event.key==='Enter')login()"><button class="btn" onclick="login()">Ingresar</button></div>`}
async function login(){const{error}=await SB.auth.signInWithPassword({email:$('#l_e').value.trim(),password:$('#l_p').value});if(err(error))return;load()}
async function logout(){clearInterval(window._poll);window._poll=null;known=null;S.eid=null;S.admin=false;ADM.rows=null;await SB.auth.signOut();showLogin()}
async function load(){
const{data:{user}}=await SB.auth.getUser();
const{data:est}=await SB.rpc('mi_estado');if(est==='suspendido'){alert('Tu cuenta está suspendida. Comunicate con FoodSuite AI para reactivarla.');return logout()}
const{data:adm}=await SB.rpc('es_superadmin');S.admin=adm===true;
const{data:me,error:e1}=await SB.from('usuarios').select('empresa_id,nombre,empresas(nombre,slug,rubro,ciudad,telefono,alias_pago,sena_pct,reserva_mesa)').eq('id',user.id).single();
if(e1||!me){alert('Tu usuario no está vinculado a ninguna empresa.');return logout()}
S.eid=me.empresa_id;S.nombre=me.empresas?.nombre||'';S.ciudad=me.empresas?.ciudad||'';S.telefono=me.empresas?.telefono||'';S.alias=me.empresas?.alias_pago||'';S.sena=me.empresas?.sena_pct??50;S.rm=me.empresas?.reserva_mesa!==false;S.slug=me.empresas?.slug;S.rubro=me.empresas?.rubro;$('#emp').textContent='· '+(S.nombre||'Gastronómico');document.title=(S.nombre||'Gastronómico')+' · FoodSuite AI';
const[c,p,o,ct,rv]=await Promise.all([SB.from('clientes').select('*').order('nombre'),SB.from('productos').select('*').order('nombre'),SB.from('pedidos').select('*,pedido_detalle(*)').order('numero',{ascending:false}),SB.from('categorias').select('*').order('orden').order('nombre'),SB.from('reservas').select('*').order('fecha').order('hora')]);
if(err(c.error||p.error||o.error||ct.error||rv.error))return;
S.clientes=c.data;S.productos=p.data;S.pedidos=o.data;S.categorias=ct.data;S.reservas=rv.data;$('#out').style.display='';render();if(!window._poll){window._poll=setInterval(chequear,20000);chequear()}}
function go(v){view=v;render()}
function render(){$('nav').innerHTML=VIEWS.filter(([k])=>k!=='admin'||S.admin).map(([k,l])=>`<button class="${k===view?'on':''}" onclick="go('${k}')">${l}</button>`).join('');$('#app').innerHTML=V[view]();if(view==='qr')drawQR()}

const V={
dashboard(){const m=today().slice(0,7),P=S.pedidos.filter(o=>(o.fecha_entrega||o.creado_en||'').slice(0,7)===m),t=P.reduce((s,o)=>s+Number(o.total),0),n=P.length;
return `<h2>Dashboard</h2><div class="grid"><div class="card kpi"><small>Ventas del mes</small><b>${money(t)}</b></div><div class="card kpi"><small>Pedidos</small><b>${n}</b></div><div class="card kpi"><small>Clientes</small><b>${S.clientes.length}</b></div><div class="card kpi"><small>Ticket medio</small><b>${money(n?t/n:0)}</b></div></div>
<div class="card"><b>Pedidos por estado</b>${ST.map(([k,l])=>`<div>${l}: ${S.pedidos.filter(o=>o.estado===k).length}</div>`).join('')}</div>`},
clientes(){return `<h2>${CFG.clientes.t} <button class="btn" onclick="edit('clientes')">+ Nuevo Cliente</button></h2><div class="card scroll"><table><tr><th>Cliente</th><th>Teléfono</th><th>Compras</th><th>Facturación</th><th>Estado</th><th></th></tr>
${S.clientes.map(c=>{const s=cs(c.id);return `<tr><td>${esc(c.nombre)}</td><td>${esc(c.telefono)}</td><td>${s.n}</td><td>${money(s.t)}</td><td>${c.vip?'VIP':'Regular'}</td><td><button class="btn g" onclick="edit('clientes','${c.id}')">Editar</button> <button class="btn g" onclick="del('clientes','${c.id}')">✕</button></td></tr>`}).join('')}</table></div>`},
productos(){return `<h2>Productos <button class="btn" onclick="edit('productos')">+ Nuevo</button></h2><div class="card scroll"><table><tr><th></th><th>Nombre</th><th>Categoría</th><th>Precio</th><th></th></tr>
${S.productos.map(p=>`<tr><td>${p.imagen_url?`<img src="${esc(p.imagen_url)}" width="44" height="44" style="object-fit:cover;border-radius:8px">`:''}</td><td>${esc(p.nombre)}</td><td>${esc(catn(p.categoria_id))}</td><td>${money(p.precio)}</td><td><button class="btn g" onclick="edit('productos','${p.id}')">Editar</button> <button class="btn g" onclick="del('productos','${p.id}')">✕</button></td></tr>`).join('')}</table></div>`},
pedidos(){return `<h2>Pedidos <button class="btn" onclick="newPed()">+ Nuevo</button></h2><div class="card scroll"><table><tr><th>#</th><th>Cliente</th><th>Detalle</th><th>Entrega</th><th>Total</th><th>Estado</th><th></th></tr>
${S.pedidos.map(o=>`<tr><td>#${o.numero}</td><td>${esc(quien(o))}</td><td>${esc(itxt(o))}</td><td>${fh(o)}</td><td>${money(o.total)}</td><td>${lab(o.estado)}</td><td>${o.tipo==='retiro'?`<a class="btn g" target="_blank" rel="noopener" href="${waPed(o)}">WhatsApp</a> ${Number(o.sena)>0?`<button class="btn g" onclick="senaOk('${o.id}',${!o.sena_pagada})">${o.sena_pagada?'Seña ✓':'Marcar seña'}</button> `:''}`:''}<button class="btn g" onclick="del('pedidos','${o.id}')">✕</button></td></tr>`).join('')}</table></div>`},
kanban(){return `<h2>Producción</h2><div class="kan">${ST.map(([k,l])=>`<div class="col" ondragover="event.preventDefault()" ondrop="drop(event,'${k}')"><h3>${l}</h3>
${S.pedidos.filter(o=>o.estado===k).map(o=>`<div class="k" draggable="true" ondragstart="event.dataTransfer.setData('t','${o.id}')"><b>#${o.numero} ${esc(quien(o))}</b><br>${esc(itxt(o))}<br><span class="mu">${fh(o)} · ${money(o.total)}</span><br><button class="btn g" onclick="mv('${o.id}',-1)">◀</button> <button class="btn g" onclick="mv('${o.id}',1)">▶</button></div>`).join('')}</div>`).join('')}</div>`}
};

let cal=new Date(),selDay=null,wa={cid:null,conv:null,msgs:[]};
V.calendario=()=>{const y=cal.getFullYear(),m=cal.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
let h=`<p class="mu">● = pedidos para retirar y reservas de mesa del día (tocá un día para ver el detalle)</p><h2><button class="btn g" onclick="cm(-1)">◀</button> ${cal.toLocaleDateString('es-AR',{month:'long',year:'numeric'})} <button class="btn g" onclick="cm(1)">▶</button></h2><div class="cal">`;
['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'].forEach(d=>h+=`<div class="mu">${d}</div>`);
for(let i=0;i<first;i++)h+='<div></div>';
for(let d=1;d<=days;d++){const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,c=S.pedidos.filter(o=>o.fecha_entrega===ds&&o.tipo!=='mesa').length+S.reservas.filter(r=>r.fecha===ds&&r.estado!=='cancelada').length;
h+=`<div class="d" onclick="selDay='${ds}';render()"><b>${d}</b>${c?`<i>● ${c}</i>`:''}</div>`}
h+='</div>';
if(selDay){const L=S.pedidos.filter(o=>o.fecha_entrega===selDay&&o.tipo!=='mesa'),R=S.reservas.filter(r=>r.fecha===selDay&&r.estado!=='cancelada');h+=`<div class="card" style="margin-top:10px"><b>${fmt(selDay)}</b>${L.map(o=>`<div>🛍️ ${(o.hora||'').slice(0,5)} #${o.numero} ${esc(quien(o))} · ${esc(itxt(o))} · ${lab(o.estado)}</div>`).join('')}${R.map(r=>`<div>🪑 ${(r.hora||'').slice(0,5)} ${esc(resNom(r))} · ${r.personas} persona${r.personas>1?'s':''} · ${r.estado}</div>`).join('')}${L.length+R.length?'':'<div class="mu">Sin pedidos ni reservas</div>'}</div>`}
return h};
function cm(d){cal=new Date(cal.getFullYear(),cal.getMonth()+d,1);render()}
V.whatsapp=()=>{const c=S.clientes.find(x=>x.id===wa.cid);
return `<h2>WhatsApp Business</h2><div class="wa"><div class="card">${S.clientes.map(x=>`<button class="btn ${x.id===wa.cid?'':'g'}" style="display:block;width:100%;margin-bottom:6px" onclick="selC('${x.id}')">${esc(x.nombre)}</button>`).join('')||'<span class="mu">Sin clientes</span>'}</div>
<div class="card">${c?`<div class="chat">${wa.msgs.map(m=>`<div class="msg ${m.emisor[0]}"><small>${m.emisor==='cliente'?'Cliente':m.emisor==='sistema'?'FoodSuite AI':'Equipo'}</small><br>${esc(m.texto)}</div>`).join('')||'<span class="mu">Sin mensajes</span>'}</div><input id="w_t" placeholder="Escribí un mensaje"><button class="btn" onclick="sendW('usuario')">Enviar</button> <button class="btn g" onclick="sendW('cliente')">Simular mensaje del cliente</button> ${c.telefono?`<a class="btn g" target="_blank" rel="noopener" href="https://wa.me/${esc(c.telefono.replace(/\D/g,''))}">Abrir en WhatsApp</a>`:''}`:'<span class="mu">Elegí un cliente</span>'}</div>
<div class="card">${c?`<b>${esc(c.nombre)}</b><p>${c.vip?'VIP':'Regular'}<br>${cs(c.id).n} compras<br>${money(cs(c.id).t)} gastado</p>`:''}</div></div>`};
async function selC(id){wa.cid=id;wa.conv=null;wa.msgs=[];const{data}=await SB.from('conversaciones').select('id').eq('cliente_id',id).limit(1);if(data&&data[0]){wa.conv=data[0].id;await loadM()}render()}
async function loadM(){const{data}=await SB.from('mensajes').select('*').eq('conversacion_id',wa.conv).order('creado_en');wa.msgs=data||[]}
async function sendW(f){const t=$('#w_t').value.trim();if(!t)return;
if(!wa.conv){const{data,error}=await SB.from('conversaciones').insert({empresa_id:S.eid,cliente_id:wa.cid}).select().single();if(err(error))return;wa.conv=data.id}
const rows=[{emisor:f,texto:t}];
if(f==='cliente')rows.push({emisor:'sistema',texto:/torta/i.test(t)?'Perfecto. ¿Para qué fecha?':'¡Hola! ¿En qué te puedo ayudar?'});
for(const r of rows){const{error}=await SB.from('mensajes').insert({...r,empresa_id:S.eid,conversacion_id:wa.conv});if(err(error))return}
await loadM();render()}
const catn=id=>(S.categorias.find(x=>x.id===id)||{}).nombre||'—';
const SUG={pasteler:['Tortas','Cheesecakes','Tartas','Cupcakes y postres','Panificados'],cafeter:['Cafés','Té e infusiones','Bebidas frías','Pastelería','Sándwiches y tostados'],panader:['Panes','Facturas','Tortas','Sándwiches de miga','Salados'],restaur:['Entradas','Platos principales','Pastas','Parrilla','Postres','Bebidas']};
const sugeridas=()=>{const r=(S.rubro||'').toLowerCase(),k=Object.keys(SUG).find(x=>r.includes(x));return k?SUG[k].filter(n=>!S.categorias.some(c=>c.nombre.toLowerCase()===n.toLowerCase())):[]};
V.categorias=()=>{const sg=sugeridas();
return `<h2>Categorías <button class="btn" onclick="addCat()">+ Nueva</button></h2><p class="mu">Armá las categorías como está organizada la carta de tu local. Este es el orden en que las ve el cliente.</p>${sg.length?`<div class="card" style="margin-bottom:10px"><b>Ideas para ${esc(S.rubro)}</b> <span class="mu">(tocá las que te sirvan, o ignoralas)</span><div class="qrs">${sg.map(x=>`<button class="btn g" onclick="addCat('${esc(x)}')">+ ${esc(x)}</button>`).join('')}</div></div>`:''}<div class="card scroll"><table><tr><th>Nombre</th><th>Productos</th><th></th></tr>${S.categorias.map((c,i)=>`<tr><td>${esc(c.nombre)}</td><td>${S.productos.filter(p=>p.categoria_id===c.id).length}</td><td><button class="btn g" onclick="movCat(${i},-1)">↑</button> <button class="btn g" onclick="movCat(${i},1)">↓</button> <button class="btn g" onclick="renCat('${c.id}')">Renombrar</button> <button class="btn g" onclick="delCat('${c.id}')">✕</button></td></tr>`).join('')||'<tr><td class="mu">Todavía no creaste categorías</td></tr>'}</table></div>`};
async function addCat(nombre){const n=(nombre||prompt('Nombre de la categoría')||'').trim();if(!n)return;const{error}=await SB.from('categorias').insert({empresa_id:S.eid,nombre:n,orden:S.categorias.length+1});if(err(error))return;load()}
async function renCat(id){const c=S.categorias.find(x=>x.id===id),n=(prompt('Nuevo nombre',c.nombre)||'').trim();if(!n||n===c.nombre)return;const{error}=await SB.from('categorias').update({nombre:n}).eq('id',id);if(err(error))return;load()}
async function movCat(i,d){const a=S.categorias[i],b=S.categorias[i+d];if(!a||!b)return;const L=S.categorias.slice();L.splice(i,1);L.splice(i+d,0,a);for(let k=0;k<L.length;k++){const{error}=await SB.from('categorias').update({orden:k+1}).eq('id',L[k].id);if(err(error))return}load()}
async function delCat(id){if(!confirm('¿Eliminar la categoría? Los productos quedan sin categoría.'))return;const{error}=await SB.from('categorias').delete().eq('id',id);if(err(error))return;load()}
let mesas=0;
const urlBase=()=>new URL('pedir.html',location.href).href+'?e='+encodeURIComponent(S.slug);
V.qr=()=>`<h2>QR del local</h2><div class="card"><p>El <b>QR de cada mesa</b> es para pedir en el local: el cliente escanea, elige y solicita, sin cargar datos, y el pedido llega con el número de mesa. El <b>QR general</b> es para redes, WhatsApp o mostrador: desde ahí también pueden reservar mesa o pedir para retirar.</p><div class="qrs"><div class="qrc"><div id="qr0"></div><b>General (reservas y retiro)</b><small class="mu">${esc(urlBase())}</small></div></div>
<label>Cantidad de mesas (un QR por mesa, para pedir en el local)</label><input type="number" min="0" max="60" value="${mesas}" onchange="mesas=Math.min(60,Math.max(0,+this.value||0));render()"><div class="qrs">${Array.from({length:mesas},(_,i)=>`<div class="qrc"><div id="qr${i+1}"></div><b>Mesa ${i+1}</b></div>`).join('')}</div><button class="btn g" onclick="window.print()">Imprimir</button></div>`;

async function chequear(){if(!S.eid)return;
const[p,r]=await Promise.all([SB.from('pedidos').select('id,numero,tipo,mesa').order('creado_en',{ascending:false}).limit(10),SB.from('reservas').select('id').order('creado_en',{ascending:false}).limit(10)]);
if(p.error||r.error)return;
if(known){const np=p.data.filter(x=>!known.has('p'+x.id)),nr=r.data.filter(x=>!known.has('r'+x.id));
if(np.length||nr.length){aviso([...np.map(x=>x.tipo==='mesa'?'Nuevo pedido · Mesa '+x.mesa:'Nuevo pedido #'+x.numero),...nr.map(()=>'Nueva reserva de mesa')].join(' · '));known=new Set([...known,...np.map(x=>'p'+x.id),...nr.map(x=>'r'+x.id)]);await load();return}}
known=new Set([...(known||[]),...p.data.map(x=>'p'+x.id),...r.data.map(x=>'r'+x.id)])}
let rp='30';

const TIPOS={mesa:'En el local (mesa)',retiro:'Para retirar',mostrador:'Carga manual'};
const suma=L=>L.reduce((s,o)=>s+Number(o.total),0);
const enPer=()=>{const hoy=today(),ini=rp==='7'?dias(6):rp==='30'?dias(29):rp==='mes'?hoy.slice(0,7)+'-01':'0000-00-00';return S.pedidos.filter(o=>fp(o)>=ini&&fp(o)<=hoy)};
const listaBar=(arr,f)=>{const mx=Math.max(1,...arr.map(x=>x[1]));return arr.map(([k,v])=>`<div class="row"><span style="min-width:90px">${esc(k)}</span><div style="flex:1;background:var(--bd);border-radius:6px"><div style="width:${v/mx*100}%;min-width:2px;height:12px;background:var(--ac);border-radius:6px"></div></div><b style="min-width:90px;text-align:right">${f(v)}</b></div>`).join('')||'<div class="mu">Sin datos en este período</div>'};
V.reportes=()=>{const L=enPer(),t=suma(L),n=L.length,g={};
L.forEach(o=>{const k=rp==='todo'?fp(o).slice(0,7):fp(o);g[k]=(g[k]||0)+Number(o.total)});
const dia=Object.entries(g).sort().map(([k,v])=>[rp==='todo'?k.split('-').reverse().join('/'):k.slice(8)+'/'+k.slice(5,7),v]);
const pr={};L.forEach(o=>(o.pedido_detalle||[]).forEach(i=>{const k=pname(i.producto_id);pr[k]=pr[k]||{u:0,m:0};pr[k].u+=i.cantidad;pr[k].m+=i.cantidad*Number(i.precio_unitario)}));

const topP=Object.entries(pr).sort((a,b)=>b[1].m-a[1].m).slice(0,6).map(([k,v])=>[k+' ('+v.u+' u.)',v.m]);
const topC=Object.entries(cl).sort((a,b)=>b[1]-a[1]).slice(0,6);
const sp=S.pedidos.filter(o=>o.tipo==='retiro'&&Number(o.sena)>0&&!o.sena_pagada).reduce((s,o)=>s+Number(o.sena),0);
return `<h2>Reportes</h2><div>${[['7','7 días'],['30','30 días'],['mes','Este mes'],['todo','Todo']].map(([k,l])=>`<button class="btn ${rp===k?'':'g'}" onclick="rp='${k}';render()">${l}</button>`).join(' ')}</div>
<div class="grid" style="margin-top:12px"><div class="card kpi"><small>Ventas</small><b>${money(t)}</b></div><div class="card kpi"><small>Pedidos</small><b>${n}</b></div><div class="card kpi"><small>Ticket medio</small><b>${money(n?t/n:0)}</b></div><div class="card kpi"><small>Señas pendientes</small><b>${money(sp)}</b></div></div>
<div class="card" style="margin-bottom:10px"><b>Ventas por ${rp==='todo'?'mes':'día'}</b>${listaBar(dia,money)}</div>
<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))"><div class="card"><b>Productos que más facturan</b>${listaBar(topP,money)}</div><div class="card"><b>Mejores clientes</b>${listaBar(topC,money)}</div><div class="card"><b>Ventas según origen</b>${listaBar(Object.entries(tp),money)}</div></div>`};
const PREG=['¿Cuál es mi mejor cliente?','¿Cuál es el producto más vendido?','¿Cuánto vendí esta semana?','¿Qué clientes no compran hace 30 días?','¿Qué productos casi no se venden?','¿Qué señas tengo pendientes?','¿Qué tengo para hoy?'];
const nz=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
V.ia=()=>`<h2>Asistente</h2><p class="mu">Preguntale a tu negocio: responde con los datos reales de tu local.</p><div class="card"><div class="qrs">${PREG.map(q=>`<button class="btn g" onclick="ask(this.textContent)">${q}</button>`).join('')}</div><input id="q" placeholder="Escribí tu pregunta..." onkeydown="if(event.key==='Enter')ask(this.value)"><button class="btn" onclick="ask($('#q').value)">Preguntar</button><div id="ans" style="margin-top:12px"></div></div>`;
function ask(q){const t=nz(q),hoy=today();let a='';
const ult=c=>S.pedidos.filter(o=>o.cliente_id===c.id).map(fp).sort().pop();
if(/menos|poco|casi no|no se vende/.test(t)&&/producto|vende|plato/.test(t)){
const u={};S.productos.forEach(p=>u[p.id]=0);S.pedidos.forEach(o=>(o.pedido_detalle||[]).forEach(i=>{u[i.producto_id]=(u[i.producto_id]||0)+i.cantidad}));
const L=S.productos.map(p=>[p.nombre,u[p.id]||0]).sort((x,y)=>x[1]-y[1]).slice(0,5);
a=L.length?`<b>Los que menos se venden:</b>${L.map(([n,v])=>`<div>${esc(n)} · ${v?v+' u.':'sin ventas'}</div>`).join('')}<p class="mu">Podrías ofrecerlos en promoción o revisar su foto y descripción.</p>`:'Todavía no cargaste productos.'}
else if(/no compra|inactiv|hace 30|dejaron|recuper|volver/.test(t)){
const lim=dias(30),L=S.clientes.map(c=>[c,ult(c)]).filter(([c,u])=>!u||u<lim).slice(0,8);
a=L.length?`<b>Hace más de 30 días que no compran:</b>${L.map(([c,u])=>`<div class="row"><span>${esc(c.nombre)} <span class="mu">· ${u?'última compra '+fmt(u):'nunca compró'}</span></span>${c.telefono?`<a class="btn g" target="_blank" rel="noopener" href="https://wa.me/${waNum(c.telefono)}?text=${encodeURIComponent('Hola '+c.nombre+'! Hace tiempo que no te vemos por '+(S.nombre||'nuestro local')+'. Tenemos novedades en la carta, ¿te esperamos pronto?')}">WhatsApp</a>`:''}</div>`).join('')}`:'Todos tus clientes compraron en los últimos 30 días.'}
else if(/mejor cliente|mas compra|quien compra|cliente.*(top|vip)/.test(t)){
const m={};S.pedidos.forEach(o=>{if(o.cliente_id){m[o.cliente_id]=m[o.cliente_id]||{n:0,t:0};m[o.cliente_id].n++;m[o.cliente_id].t+=Number(o.total)}});
const L=Object.entries(m).sort((x,y)=>y[1].t-x[1].t).slice(0,3);
a=L.length?L.map(([id,v],i)=>`<div>${i?'':'🏆 '}<b>${esc(cname(id))}</b> · ${v.n} compra${v.n>1?'s':''} · ${money(v.t)}</div>`).join(''):'Todavía no hay compras de clientes registrados.'}
else if(/semana/.test(t)&&/vend|venta|factur|gane/.test(t)){
const a1=S.pedidos.filter(o=>fp(o)>=dias(6)&&fp(o)<=hoy),a0=S.pedidos.filter(o=>fp(o)>=dias(13)&&fp(o)<dias(6)),x=suma(a1),y=suma(a0);
a=`<b>${money(x)}</b> en ${a1.length} pedido${a1.length===1?'':'s'} en los últimos 7 días.`+(y>0?` Es un <b>${Math.abs(Math.round((x-y)/y*100))}% ${x>=y?'más':'menos'}</b> que la semana anterior (${money(y)}).`:' No hay ventas en la semana anterior para comparar.')}
else if(/\bmes\b/.test(t)&&/vend|venta|factur|gane/.test(t)){
const L=S.pedidos.filter(o=>fp(o).slice(0,7)===hoy.slice(0,7)&&fp(o)<=hoy);a=`<b>${money(suma(L))}</b> en ${L.length} pedido${L.length===1?'':'s'} este mes.`}
else if(/producto|vendido|vende|popular|plato/.test(t)){
const u={};S.pedidos.forEach(o=>(o.pedido_detalle||[]).forEach(i=>{const k=pname(i.producto_id);u[k]=u[k]||{u:0,m:0};u[k].u+=i.cantidad;u[k].m+=i.cantidad*Number(i.precio_unitario)}));
const L=Object.entries(u).sort((x,y)=>y[1].u-x[1].u).slice(0,3);
a=L.length?L.map(([k,v],i)=>`<div>${i?'':'🏆 '}<b>${esc(k)}</b> · ${v.u} vendidos · ${money(v.m)}</div>`).join(''):'Todavía no hay ventas.'}
else if(/sena/.test(t)){
const L=S.pedidos.filter(o=>o.tipo==='retiro'&&Number(o.sena)>0&&!o.sena_pagada);
a=L.length?`<b>${L.length} seña${L.length>1?'s':''} pendiente${L.length>1?'s':''} por ${money(L.reduce((s,o)=>s+Number(o.sena),0))}:</b>${L.map(o=>`<div>#${o.numero} ${esc(quien(o))} · ${money(o.sena)} · retira el ${fmt(o.fecha_entrega)}</div>`).join('')}<p class="mu">Marcalas como recibidas desde Pedidos.</p>`:'No tenés señas pendientes.'}
else if(/hoy|entregar|retirar|agenda/.test(t)){
const L=S.pedidos.filter(o=>o.fecha_entrega===hoy&&o.tipo!=='mesa'),R=S.reservas.filter(r=>r.fecha===hoy&&r.estado!=='cancelada');
a=L.length+R.length?`<b>Para hoy:</b>${L.map(o=>`<div>🛍️ ${(o.hora||'').slice(0,5)} #${o.numero} ${esc(quien(o))} · ${esc(itxt(o))}</div>`).join('')}${R.map(r=>`<div>🪑 ${(r.hora||'').slice(0,5)} ${esc(resNom(r))} · ${r.personas} persona${r.personas>1?'s':''} · ${r.estado}</div>`).join('')}`:'No tenés pedidos para retirar ni reservas hoy.'}
else if(/reserva/.test(t)){

a=R.length?`<b>Reservas pendientes de confirmar:</b>${R.map(r=>`<div>🪑 ${fmt(r.fecha)} ${(r.hora||'').slice(0,5)} · ${esc(resNom(r))} · ${r.personas} persona${r.personas>1?'s':''}</div>`).join('')}`:'No hay reservas pendientes.'}
else a='No entendí la pregunta. Probá con las sugeridas de arriba: mejor cliente, producto más vendido, ventas de la semana, clientes que no compran, señas pendientes o qué tenés para hoy.';
$('#ans').innerHTML=a}

${R.map(r=>`<tr><td>${esc(r.nombre)}<br><small class="mu">${esc(r.slug)}</small></td><td>${esc(r.rubro)}</td><td>${esc(r.ciudad)}</td><td>${esc(r.dueno)}<br><small class="mu">${esc(r.email)}</small></td><td>${r.usuarios}</td><td>${r.pedidos}</td><td>${r.ultimo_pedido?fmt(r.ultimo_pedido.slice(0,10)):'—'}</td><td>${esc(r.plan)}</td><td>${r.vence?fmt(r.vence):'—'}</td><td><b style="color:${col(r.estado)}">${r.estado}</b></td><td><button class="btn g" onclick="admGest('${r.id}')">Editar</button></td></tr>`).join('')}</table></div>
<h2 style="margin-top:18px">Nuevo local</h2>
${u?`<div class="card" style="max-width:520px;margin-bottom:12px"><b>✅ Local creado</b><p class="mu">Copiá este mensaje y mandáselo al dueño:</p><textarea id="a_msg" rows="9" style="width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit">${esc(msg)}</textarea><button class="btn" onclick="navigator.clipboard.writeText($('#a_msg').value);alert('Copiado')">Copiar mensaje</button></div>`:''}
<div class="card" style="max-width:520px"><label>Nombre del local</label><input id="a_n" oninput="$('#a_s').value=slugify(this.value)" placeholder="Ej: Panadería La Espiga"><label>Dirección del catálogo (sin espacios ni tildes; después no se cambia)</label><input id="a_s"><label>Rubro</label><select id="a_r">${RUBROS.map(r=>`<option>${r}</option>`).join('')}</select><label>Ciudad</label><input id="a_c"><label>Nombre del dueño</label><input id="a_d"><label>Email del dueño</label><input id="a_e" type="email"><label>Contraseña temporal (mínimo 8 caracteres)</label><input id="a_p"><label>Plan</label><input id="a_pl" value="prueba"><button class="btn" id="a_b" onclick="crearLocal()">Crear local</button></div>`};
async function crearLocal(){const b={nombre:$('#a_n').value.trim(),slug:$('#a_s').value.trim(),rubro:$('#a_r').value,ciudad:$('#a_c').value.trim(),dueno:$('#a_d').value.trim(),email:$('#a_e').value.trim().toLowerCase(),password:$('#a_p').value,plan:$('#a_pl').value.trim()};
if(!b.nombre||!b.slug||!b.dueno||!b.email||b.password.length<8)return alert('Completá nombre, dirección, dueño, email y una contraseña de al menos 8 caracteres.');
const btn=$('#a_b');btn.disabled=true;
const{data,error}=await SB.functions.invoke(FN_CREAR,{body:b});
btn.disabled=false;
if(error){let m=error.message;try{const j=await error.context.json();m=j.error||m}catch(e){}return alert('No se pudo crear el local: '+m)}
if(data&&data.error)return alert('No se pudo crear el local: '+data.error);
ADM.ult=b;ADM.rows=null;render()}
function admGest(id){const r=ADM.rows.find(x=>x.id===id);ADM.cur=r;
const sel=(arr,v)=>arr.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');
$('#dbody').innerHTML=`<h3>Editar local</h3><label>Nombre del local</label><input id="g_n" value="${esc(r.nombre)}"><label>Dirección del catálogo</label><input id="g_s" value="${esc(r.slug)}"><p class="mu" style="margin:0 0 8px">Si ya compartiste el enlace o imprimiste QR, cambiar esto los deja de funcionar.</p><label>Rubro</label><select id="g_r">${sel([...new Set([r.rubro,...RUBROS].filter(Boolean))],r.rubro)}</select><label>Ciudad</label><input id="g_c" value="${esc(r.ciudad)}"><label>Nombre del dueño</label><input id="g_d" value="${esc(r.dueno)}"><label>Email del dueño (con el que ingresa)</label><input id="g_m" type="email" value="${esc(r.email)}"><label>Nueva contraseña temporal (dejala vacía para no cambiarla)</label><input id="g_pw" autocomplete="new-password"><label>Estado</label><select id="g_e">${sel(['activo','suspendido'],r.estado)}</select><label>Plan</label><input id="g_p" value="${esc(r.plan)}"><label>Vence (recordatorio de cobro)</label><input id="g_v" type="date" value="${r.vence||''}"><p class="mu">Suspender un local impide que sus usuarios ingresen y oculta su catálogo; sus datos no se borran.</p><button class="btn" onclick="admGuardar()">Guardar</button> <button class="btn g" onclick="$('#dlg').close()">Cancelar</button>`;$('#dlg').showModal()}
async function admGuardar(){const r=ADM.cur,v=id=>$('#'+id).value;
const{error}=await SB.rpc('admin_editar_local',{p_id:r.id,p_nombre:v('g_n'),p_slug:v('g_s'),p_rubro:v('g_r'),p_ciudad:v('g_c'),p_estado:v('g_e'),p_plan:v('g_p'),p_vence:v('g_v')||null,p_dueno:v('g_d')});
if(err(error))return;
const viejo=(r.email||'').toLowerCase(),mail=v('g_m').trim().toLowerCase(),pw=v('g_pw');
if((mail&&mail!==viejo)||pw){
const{data,error:e2}=await SB.functions.invoke(FN_CREAR,{body:{accion:'editar_dueno',empresa_id:r.id,email:mail!==viejo?mail:'',password:pw}});
let m=e2?e2.message:(data&&data.error);
if(e2){try{const j=await e2.context.json();m=j.error||m}catch(x){}}
if(m){ADM.rows=null;$('#dlg').close();render();return alert('Los datos del local se guardaron, pero no se pudo cambiar el email o la contraseña: '+m)}}
$('#dlg').close();ADM.rows=null;render()}
function edit(k,id){const c=CFG[k],r=id?S[k].find(x=>x.id===id):{};
$('#dbody').innerHTML=`<h3>${c.t}</h3>${c.f.map(([n,l,t,o])=>{const v=n==='vip'?(r.vip?'Sí':'No'):r[n];return `<label>${l}</label>`+(t==='select'?`<select id="f_${n}">${o.map(x=>`<option ${v===x?'selected':''}>${x}</option>`).join('')}</select>`:`<input id="f_${n}" type="${t||'text'}" value="${esc(v)}">`)}).join('')}${k==='productos'?'<label>Categoría</label><select id="f_cat"><option value="">Sin categoría</option>'+S.categorias.map(c=>`<option value="${c.id}" ${r.categoria_id===c.id?'selected':''}>${esc(c.nombre)}</option>`).join('')+'</select><label>Foto</label><input id="f_img" type="file" accept="image/*">':''}<button class="btn" onclick="sv('${k}','${id||''}')">Guardar</button> <button class="btn g" onclick="$('#dlg').close()">Cancelar</button>`;$('#dlg').showModal()}
async function upImg(file){const bm=await createImageBitmap(file),sc=Math.min(1,800/Math.max(bm.width,bm.height)),cv=document.createElement('canvas');cv.width=Math.round(bm.width*sc);cv.height=Math.round(bm.height*sc);cv.getContext('2d').drawImage(bm,0,0,cv.width,cv.height);
const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.8)),path=S.eid+'/'+Date.now()+'.jpg';
const{error}=await SB.storage.from('productos').upload(path,blob,{contentType:'image/jpeg'});if(error)throw error;
return SB.storage.from('productos').getPublicUrl(path).data.publicUrl}
async function sv(k,id){const row={};CFG[k].f.forEach(([n,,t])=>{let v=$('#f_'+n).value.trim();row[n]=n==='vip'?v==='Sí':t==='number'?Number(v||0):(v||null)});
if(!row.nombre)return alert('El nombre es obligatorio');
if(k==='productos')row.categoria_id=$('#f_cat').value||null;
if(k==='productos'&&$('#f_img')&&$('#f_img').files[0]){try{row.imagen_url=await upImg($('#f_img').files[0])}catch(e){return alert('Error al subir la foto: '+e.message)}}
const q=id?SB.from(k).update(row).eq('id',id):SB.from(k).insert({...row,empresa_id:S.eid});
const{error}=await q;if(err(error))return;$('#dlg').close();load()}
async function del(k,id){if(!confirm('¿Eliminar?'))return;const{error}=await SB.from(k).delete().eq('id',id);if(err(error))return;load()}

function newPed(){draft=[];pedForm({fecha_entrega:today(),estado:'nuevo'})}
function pedForm(o){if(!S.clientes.length||!S.productos.length)return alert('Primero cargá al menos un cliente y un producto.');
const opt=(a,s)=>a.map(x=>`<option value="${x.id}" ${x.id===s?'selected':''}>${esc(x.nombre)}</option>`).join('');
$('#dbody').innerHTML=`<h3>Nuevo pedido</h3><label>Cliente</label><select id="p_c">${opt(S.clientes,o.cliente_id)}</select><label>Productos</label>
<div>${draft.map((i,x)=>`<div>${i.q}× ${esc(pname(i.p))} <button class="btn g" onclick="rmI(${x})">✕</button></div>`).join('')||'<span class="mu">Sin productos</span>'}</div>
<select id="p_p">${opt(S.productos)}</select><input id="p_q" type="number" min="1" value="1"><button class="btn g" onclick="addI()">+ Agregar producto</button>
<label>Fecha de entrega</label><input id="p_f" type="date" value="${o.fecha_entrega||today()}"><label>Estado</label><select id="p_e">${ST.map(([k,l])=>`<option value="${k}" ${o.estado===k?'selected':''}>${l}</option>`).join('')}</select>
<button class="btn" onclick="svP()">Guardar</button> <button class="btn g" onclick="$('#dlg').close()">Cancelar</button>`;if(!$('#dlg').open)$('#dlg').showModal()}
const keep=()=>({cliente_id:$('#p_c').value,fecha_entrega:$('#p_f').value,estado:$('#p_e').value});
function addI(){const o=keep();draft.push({p:$('#p_p').value,q:Math.max(1,+$('#p_q').value||1)});pedForm(o)}
function rmI(x){const o=keep();draft.splice(x,1);pedForm(o)}
async function svP(){if(!draft.length)return alert('Agregá al menos un producto');
const price=id=>Number((S.productos.find(x=>x.id===id)||{}).precio||0),total=draft.reduce((s,i)=>s+price(i.p)*i.q,0);
const{data,error}=await SB.from('pedidos').insert({...keep(),empresa_id:S.eid,total}).select().single();if(err(error))return;
const{error:e2}=await SB.from('pedido_detalle').insert(draft.map(i=>({empresa_id:S.eid,pedido_id:data.id,producto_id:i.p,cantidad:i.q,precio_unitario:price(i.p)})));if(err(e2))return;
$('#dlg').close();load()}
async function setEst(id,e){const{error}=await SB.from('pedidos').update({estado:e}).eq('id',id);if(err(error))return;load()}
function mv(id,d){const o=S.pedidos.find(x=>x.id===id),i=ST.findIndex(x=>x[0]===o.estado)+d;if(i>=0&&i<ST.length)setEst(id,ST[i][0])}
function drop(e,k){e.preventDefault();const id=e.dataTransfer.getData('t');if(id)setEst(id,k)}
$('#logo').innerHTML=LOGO(44);boot();
</script>
</body>
